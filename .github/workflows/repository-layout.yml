name: Repository layout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    name: repository-layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed layout
        run: python3 scripts/check_layout.py --revision HEAD --worktree
      - name: Install stack manifest parser
        run: python3 -m pip install PyYAML
      - name: Exercise guards and stack entrypoints
        run: python3 -m unittest discover -s scripts/tests -v
