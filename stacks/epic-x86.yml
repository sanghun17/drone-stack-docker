# epic-x86 — EPIC LiDAR exploration stack
# (kimhyoon/EPIC-stack @ feat/early-finish-and-viewpoint-diagnostics) on an
# x86 desktop/laptop with NO NVIDIA GPU. Replaces the standalone epic_ws/docker
# compose setup; everything the image needs is declared in modules/planner/epic's
# module.yml, so a fresh host only ever runs `docker build` — nothing is installed
# into a running container.
#
# The whole stack is self-contained in ONE container: roscore, the livox driver,
# FAST_LIO, the TF/odom relays, the EPIC planner, MAVROS and RViz. Unlike sim-x86
# (which shares a roscore running on the host) the master lives INSIDE the
# container — see config/epic.env.
#
# gpu: false — EPIC uses no CUDA at all (the only GPU work is OpenGL for RViz and
# MARSIM's point-cloud renderer, which mesa serves on the host's iGPU). Without
# this key the generator would emit the amd64 default device reservation and
# compose would refuse to start the container on a GPU-less host.
#
# gpu_arch: nogpu — sentinel, not a real micro-arch. Selects base's
# `base_image.amd64_nogpu` (plain ubuntu:20.04) through the normal
# `<arch>_<gpu_arch>` lookup instead of the CUDA images the ete-train-*/sim
# stacks need. See modules/base/module.yml for why the base image must NOT be one
# that already ships the ROS apt repo.
#
#   ./setup.sh clone    epic-x86     # EPIC-stack@feat/early-finish-and-viewpoint-diagnostics -> ws/epic
#   ./setup.sh up       epic-x86     # gen + docker build + container (idle)
#   ./setup.sh build-ws epic-x86     # catkin build in the container
#   ./setup.sh run      epic-x86 planner/epic/run_epic.sh
#
# Bring-up order on real hardware (each in its own terminal, or use the run
# scripts directly): run_livox -> run_fastlio -> run_mavros -> run_tf_relay ->
# run_epic. Offline instead: run_replay.sh /bags/<flight>.bag
arch: [amd64]
gpu_arch: nogpu
gpu: false
modules:
  - planner/epic          # livox_ros_driver2 + FAST_LIO + EPIC planner + MARSIM, one ws
