# First-route capture per pad campaign: exact RGB input plus normal evidence.
# Select via FLIGHT_SAFETY_RECORDER_CONFIG. ARM starts and disarm stops capture.
# At 1280x720 RGB8/60Hz the pre-LZ4 payload is 166 MB/s; verify camera,
# estimator and recording rates while disarmed before using this profile in flight.
# This profile changes recording only; it does not arm or command the vehicle.
bag_dir: /work/flight_logs
prefix: safety
record_all: false
exclude: ''
lz4: true
stop_settle: 10.0
webcam_enable: true
webcam_start_srv: /recorder/start
webcam_stop_srv: /recorder/stop
webcam_timeout: 5.0
odom_history_enable: false
odom_history_start_srv: /robot_odom_history/start
odom_history_stop_srv: /robot_odom_history/stop
odom_history_timeout: 1.0
runtime_manifest_enable: true
runtime_manifest_suffix: .runtime_manifest.yaml
runtime_manifest_command_timeout_s: 6.0
runtime_manifest_git_diff_max_bytes: 262144
runtime_manifest_repo_paths:
  drone_stack: /work
  flight_safety: /work/ws/flight-safety/src/flight_safety
  aruco_landing: /work/ws/aruco-landing/src/aruco_landing
runtime_manifest_config_paths:
  geofence: /work/stacks/aruco-landing-jetson/config/geofence.yaml
  aruco_runtime: /work/stacks/aruco-landing-jetson/config/runtime.env
  aruco_pad: /work/stacks/aruco-landing-jetson/config/physical_pad.yaml
  body_camera_calibration: /work/stacks/aruco-landing-jetson/config/calibration/20260919/base_link_to_see3cam_optical_frame.yaml
  camera_time_alignment: /work/stacks/aruco-landing-jetson/config/calibration/20260919/time_alignment.yaml
  camera_intrinsics: /work/stacks/aruco-landing-jetson/config/see3cam_intrinsic_20260915.yaml
  selected_baseline_pad: /work/ws/aruco-landing/src/aruco_landing/config/paper_pad_layout_physical_20260920_runtime.yaml
  selected_proposed1_pad: /work/ws/aruco-landing/src/aruco_landing/config/proposed_pad_1_layout_physical_20260920_runtime.yaml
  aruco_trial: /work/ws/aruco-landing/src/aruco_landing/launch/landing_trial.launch
  aruco_controller: /work/ws/aruco-landing/src/aruco_landing/config/common_experiment.yaml
  repeat_trial: /work/stacks/aruco-landing-jetson/config/repeat_trial.yaml
  module_sources: /work/config/modules.lock.json
  flight_safety_recorder: /work/stacks/aruco-landing-jetson/config/flight_safety_recorder_raw.yaml
conditional_topic_groups:
- topics: [/landing/camera/image_raw]
  status_topic: /landing/trial/status
  field: trajectory_set.next_index
  equals: 0
  max_age_s: 2.0
  # Preserve diagnostic evidence when the route identity is unavailable.
  on_unavailable: include
topics:
- /vrpn_client_node/pure/pose
- /landing/vision_pose_marker
- /landing/vehicle_pose_pad
- /landing/target_pose_camera
- /landing/pad_pose_global
