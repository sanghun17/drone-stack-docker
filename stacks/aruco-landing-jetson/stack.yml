project: aruco
# Real-hardware stack. The landing planner starts movement only on pilot OFFBOARD entry.
arch: [arm64]
# Use the same master as the established risk-aware hardware stack so MAVROS
# arming and the ml-host /recorder webcam services are shared, not duplicated.
ros_master_port: 11311
ros_master_host: 192.168.50.36
gui:
  display: 100
  vnc_port: 5901
  web_port: 6081
  rviz_config: /work/stacks/aruco-landing-jetson/config/detected_preview.rviz
environment:
  SESSION_RECORDER_PROFILE: hardware
  SESSION_RECORDER_CONFIG: /work/stacks/aruco-landing-jetson/config/session_recorder.yaml
  # Bench lighting: gain 10 saturated 31.6% of pixels and erased marker edges.
  # Keep this scenario-specific instead of changing the reusable camera module.
  SEE3CAM_GAIN: "1"
  # Trial-gated router; stack runtime.env selects the generic MUX external input.
  LANDING_ALLOW_MARKER_SWITCH: "true"
  LANDING_AUTO_SWITCH: "true"
  LANDING_AUTO_FALLBACK_TO_OPTITRACK: "true"
  LANDING_MARKER_LOSS_TIMEOUT_S: "0.5"
modules:
  - sensor/see3cam-24cug
  - perception/aruco-landing
  # planner/aruco-landing launches its trial-gated pose router.
  - planner/aruco-landing
  - control/mavros
  - control/flight-safety
  - utility/rviz
  - utility/rqt
  - utility/session-recorder
  - odometry/optitrack
