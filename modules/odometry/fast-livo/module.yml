name: fast-livo
group: odometry
description: FAST-LIVO2 (visual/LiDAR-inertial odometry). Sophus dep baked into the image; fast_livo itself is built in-container from the bind-mounted source workspace.

deps:
  source: [install.sh]      # Sophus a621ff (libSophus.so + sophus/se3.h)

# source + workspace live under the repo at ws/fast-livo (-> /work/ws/fast-livo),
# cloned by `up.sh clone`. No external mount (the repo is mounted at /work).
workspace: /work/ws/fast-livo
clone: clone.sh
run: [run.sh]
provides: [odometry, odom-tf]
