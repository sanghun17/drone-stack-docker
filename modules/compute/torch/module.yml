name: torch
group: compute
description: >
  arm64 (Jetson Orin): PyTorch 2.1.0, ships libtorch (torch/lib + cmake) that voxblox
  C++ links against. amd64, branched by GPU_ARCH inside install.sh (see there for why
  this stays imperative rather than a deps.<combo>.pip entry -- torch needs a custom
  --index-url, which the declarative deps.pip list can't express): sm_120 (RTX 5090/
  Blackwell) = official PyTorch cu128 wheels, also upgrades the image's python3 to
  3.11 since cu128 wheels need >=3.9 and that base_image ships 3.8. sm_89 (RTX 4090)
  / sm_75 (RTX 2080 Ti), both driver-535-capped hosts = PyTorch cu121 wheels, no
  python upgrade needed (cu121 supports 3.8 natively) -- UNLESS the stack sets
  `build_env: {TORCH_VARIANT: src-abi1}` (currently only sim-x86), in which case the
  sm_89/sm_75 branch instead installs the host-source-built torch 2.2.2 wheel from
  wheels/ (ABI=1, CUDA-unbundled, shares the base image's system libcudnn8 with
  jaxlib instead of shadowing it with a bundled cuDNN -- see install.sh for the full
  rationale). That wheel is git-untracked (274MB, host-local only) -- see
  wheels/README.md for its provenance/rebuild procedure.

deps:
  # torch wheel links these at runtime (not in the L4T base)
  apt:
    - libopenblas-dev
    - libomp-dev
    - libopenmpi-dev
  # arch-specific torch wheel is selected inside install.sh ($TARGETARCH)
  source:
    - install.sh

assets: [wheels]   # src-abi1 variant's torch-2.2.2-*.whl, bind-mounted into install.sh's
                    # RUN (see gen_dockerfile_compose.py) -- host-local, git-untracked
                    # (wheels/README.md IS tracked, keeps the dir from disappearing)

provides: [torch, libtorch]
