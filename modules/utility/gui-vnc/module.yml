name: gui-vnc
group: utility
description: Shared headless-GUI-over-VNC chain for the utility/* GUIs (rviz, rqt, ...). GUIs render on
  a virtual Xvfb display with mesa software GL (the L4T nvidia GL can't direct-render Qt/OpenGL apps on a
  headless display), x11vnc turns that display into a VNC stream, and websockify serves a modern noVNC
  (installed to /opt/novnc — apt's novnc is too old) so you view it in ANY BROWSER with zero install —
  no VNC client and no ssh -X needed. Pulled in via `needs:` by utility/rviz, utility/rqt, etc.

deps:
  apt:
    - xvfb               # virtual X display (:99/:98) to render onto
    - x11vnc             # exposes that display as a VNC server (bound to localhost)
    - websockify         # bridges the VNC port to a WebSocket so a plain browser can connect (zero install)
    - python3-numpy      # websockify HyBi fast path — faster at the higher framerates we now run
    - libgl1-mesa-dri    # software GL (llvmpipe) so 3D renders without the nvidia GL
    - libgl1-mesa-glx
    - x11-utils          # xwininfo / xdpyinfo / xprop — inspect the headless display when debugging
    - openbox            # lightweight WM: gives GUI windows a title bar so you can move/resize/maximize
    - zenity             # GTK file dialog backend for tinyfiledialogs (realsense-viewer Load/Save preset)
  source:
    - install.sh         # fetch modern noVNC (1.4.0) -> /opt/novnc; apt's novnc (1.0.0) lacks the
                         #   Quality/Compression UI + resize/quality URL params we want

mounts:
  - "/tmp/.X11-unix:/tmp/.X11-unix"   # host X socket (X11)

run: []
provides: [gui-vnc]
