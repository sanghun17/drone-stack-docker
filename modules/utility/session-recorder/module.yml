name: session-recorder
group: utility
description: Profile-driven experiment session recorder. A common start/stop core records rosbag data; hardware optionally maps MAVROS arming to the session edge and triggers the external webcam.

deps:
  apt:
    - ros-noetic-rosbag
    - ros-noetic-mavros-msgs

run:
  - run.sh
  - sessionctl.sh
provides: [experiment-recording]
