name: ete-net
group: training
description: >
  ETE-Net (uncertainty_predictor) training container. group=training (not "ml" --
  renamed 2026-07-14: the group axis is role-based (sensor/odometry/planner/control/
  compute/utility), and "ml" was a technology name that also reads ambiguously
  against inference/deployment, which would also be "ml"). Training is ROS-free (see
  docs/ETE_TRAIN_GPU_HOSTS.md dependency audit -- rosbag/rospy only appear in the lazy
  Stage-0 raw-bag-to-pkl path and offline eval tools, never in train.py's call chain
  when caches already exist). Pulls compute/torch + compute/spconv (amd64_sm120 combo
  for Blackwell) but does NOT need sensor/odometry/planner/control modules. `base`
  (ROS Noetic) is still installed because the schema always includes it, but is unused
  here -- see stacks/ete-train-5090.yml for the minimal module list this actually needs.

needs: [compute/torch, compute/spconv]

deps:
  pip:
    # --ignore-installed: confirmed on a real amd64/ubuntu20.04 build 2026-07-14 --
    # without it, pip's attempt to upgrade the apt-provided PyYAML 5.3.1 (distutils-
    # installed, pulled in transitively by some apt package on the base image) to
    # 6.0.1 hard-fails with "Cannot uninstall PyYAML 5.3.1 ... distutils installed
    # project". `-I`/`--ignore-installed` sidesteps the uninstall entirely (installs
    # 6.0.1 alongside/over it in site-packages instead of trying to remove the apt
    # one first) -- safe here since nothing else on the image needs the apt PyYAML.
    - --ignore-installed
    - PyYAML==6.0.1
    - scipy==1.10.1
    - tensorboard==2.14.0
    - tensorboardX==2.6.2.2
    - tqdm
    - matplotlib
    # scikit-learn: found missing 2026-07-14 on a real parity-run attempt --
    # dataset/data_prefetcher.py imports sklearn.model_selection.GroupShuffleSplit
    # (train/val split), not caught by the earlier static import-grep audit because
    # it's used inside a function body, not a top-level `import sklearn` line.
    # Version matches the ML desktop's actual pinned version (`pip freeze`).
    - scikit-learn==0.24.0
  # numpy is pinned by compute/torch's install.sh already (1.24.3, both arches) --
  # deliberately not re-listed here to avoid a second, possibly-conflicting resolve.
  # No amd64_sm120 combo needed for this module: none of these packages vary by GPU
  # micro-arch (only CUDA-linked packages like torch/spconv do) -- included as the
  # "doesn't need the new dimension" counter-example to compute/spconv's combo usage.

# Live checkout bind-mount, NOT a clone.sh + pinned-branch clone (unlike
# planner/risk-aware) -- this is an active training-code iteration host, not a pinned
# deploy target, so we want whatever's actually on disk (uncommitted WIP included).
# ${RISK_AWARE_PLANNING_SRC} = the risk-aware_planning repo's `src/` directory on THIS
# host (set in config/stack.env) -- points at the new canonical tree
# (drone-stack-docker/ws/risk-aware/src/risk_aware_planning), NOT the retired
# ~/risk-aware_planning checkout.
#
# UPDATED 2026-07-25 (경로 동적화 Phase 2b): the mount TARGET no longer needs to be
# the exact absolute path the data lives at -- ete_net/config/ete_train_config.yaml's
# `data.final_dir` / `intermediate_dir` / `v22_sim_windows_dir` now read `${DATA_ROOT}`
# (expanded by ete_net/utils/config.py, halts loudly if unset) instead of a baked
# `/home/ml/risk-aware_planning/...` literal, so code and data are mounted
# independently below. Kept the code mount TARGET as the old absolute path anyway
# (train.sh still `cd`s there) -- no functional requirement forces it now, this is
# just the path of least churn.
#
# The mount TARGET must still keep uncertainty_predictor/ and mav_active_3d_planning/
# as siblings, because ete_net/utils/config.py resolves mav_active_3d_planning/
# local_planner_mpc purely relative to its own __file__ (4 levels up) -- no $HOME /
# no absolute-path fallback.
#
# Data mount is separate now: ${ETE_DATA_DIR} (host, config/stack.env) -> a plain
# /home/ml/data mount target, with container env DATA_ROOT pointed at the same path
# so ete_train_config.yaml's ${DATA_ROOT} expansion resolves. Move ETE_DATA_DIR in
# stack.env if data is ever relocated again -- no code change needed.
#
# UPDATED 2026-07-25 (정본 레이아웃 통합, DATA_MAP.md): ${ETE_DATA_DIR} now points at
# the whole /home/ml/data canonical tree (raw/stage1/stage2 tiers), not the old flat
# uncertainty_predictor/data/ dir -- so the mount target changed from
# .../uncertainty_predictor/data (which implied the old flat layout) to a plain
# /home/ml/data, and DATA_ROOT follows it. Any ete_train_config.yaml key still written
# as ${DATA_ROOT}/data_final/... (old flat-dir convention) now resolves to a path that
# doesn't exist under the tiered tree and halts loudly on load -- intentional, not a
# regression: those configs need updating to the new stage1/stage2/... paths, which is
# out of scope for this mount/env-alignment change.
mounts:
  # 코드는 마운트하지 않는다 — clone.sh 가 ws/risk-aware/src/risk_aware_planning 으로
  # git clone 하고, dsd 루트가 컨테이너에 /work 로 마운트되므로 /work/ws/... 로 자동
  # 노출된다 (fast-livo 등 다른 모듈과 동일한 패턴). 이전에는 ${RISK_AWARE_PLANNING_SRC}
  # 라는 임의의 호스트 절대경로를 마운트했는데, 그건 배포 스택이 이미 clone 해둔 트리가
  # 있는 머신에서만 성립해서 학습 전용 호스트(im)에서 깨졌다. (2026-07-25)
  - "${ETE_DATA_DIR}:/home/ml/data"

env:
  DATA_ROOT: /home/ml/data

run: [train.sh]
provides: [ete-net-training]
