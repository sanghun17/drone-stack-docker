name: flight-safety
group: control
description: Layered flight safety — L1 per-subsystem diagnosis (incl. geofence) -> /diagnostics, L2 monitor (worst fault) -> /flight_safety/fault, L3 response/mux (manual + severity -> normal/land/kill), plus an estimator MUX that selects mocap-vs-vio -> /mavros/vision_pose/pose. All four come up at once via run.sh. Source lives in the risk-aware workspace (sibling of risk_aware_planning), so it builds there and gets mavros_msgs for free.

needs: [planner/risk-aware]     # flight_safety builds in ws/risk-aware; uses mavros_msgs

deps:
  apt:
    - ros-noetic-diagnostic-updater
    - ros-noetic-rqt-runtime-monitor   # /diagnostics view that run.sh opens in a browser
    - ros-noetic-topic-tools           # topic_tools/mux for the estimator mux

clone: clone.sh
# run.sh = the WHOLE module at once (observe + response/KILL + estimator mux + diagnostic GUI)
# -> scripts/control_flight-safety.sh. Ctrl-C kills all of it. Actuation gated by require_armed.
run: [run.sh]
provides: [flight-safety, vision-pose]
