name: local-controller
group: control
description: Standalone trajectory-to-MAVROS velocity controller. Consumes standard trajectory_msgs and nav_msgs, and publishes through a configurable safety-mux topic.

deps:
  apt:
    - ros-noetic-mavros-msgs
    - ros-noetic-nav-msgs
    - ros-noetic-std-srvs
    - ros-noetic-tf
    - ros-noetic-trajectory-msgs

run: [run.sh]
provides: [trajectory-controller, mavros-setpoint-source]
