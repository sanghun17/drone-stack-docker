name: mavros
group: control
description: Standalone MAVROS bridge to the PX4 FCU. Connection URLs come from config/stack.env.

deps:
  # GeographicLib: link dep for the ws build + runtime datasets (moved OUT of base
  # on purpose — keeps the base layer frozen so compute layers never rebuild)
  apt:
    - ros-noetic-mavlink
    - ros-noetic-mavros
    - ros-noetic-mavros-extras
    - ros-noetic-mavros-msgs
    - geographiclib-tools
    - libgeographic-dev
  source:
    - install.sh              # geographiclib datasets download

mounts:
  - "/dev:/dev"                 # FCU serial (e.g. /dev/ttyUSB0)

run: [run.sh]
provides: [fcu, mavros]
