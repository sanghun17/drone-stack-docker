name: risk-aware-sim
group: planner
description: >
  Risk-aware exploration planner, AirSim/UE4 sim variant — voxblox (uncertainty TSDF)
  + mav_active_3d_planning exploration + JAX MPPI local planner + SO(3) control
  bridge. Built in-container from the SAME live tree the ete-train-* stacks use
  (${RISK_AWARE_PLANNING_SRC}, bind-mounted — not cloned, unlike planner/risk-aware's
  pinned-branch deploy checkout: sim iterates on the same uncommitted WIP dev tree).

needs: [compute/torch, compute/spconv, compute/jax]   # torch/spconv (model) + jax (MPPI)

deps:
  # build deps for the ETH-ASL workspace: catkin_grpc builds grpc from source
  # (rsync/libtool/autotools/ssl/zlib), protobuf_catkin builds protobuf from source.
  # Identical to planner/risk-aware's apt list — same catkin workspace tree.
  apt:
    - rsync
    - libtool
    - autoconf
    - automake
    - pkg-config
    - zlib1g-dev
    - libssl-dev
    - libtbb-dev
    - ros-noetic-tf-conversions
    - ros-noetic-tf2-geometry-msgs
    - ros-noetic-interactive-markers
    - ros-noetic-geographic-msgs
    - ros-noetic-nlopt
    - python3-future
    - libdw-dev
    - ros-noetic-control-toolbox
    # ↓ sim 전용 추가 (2026-07-25 첫 build-ws 실증): jetson d435i 스택에선 ros-base
    #   베이스이미지·control/mavros 모듈이 공급하던 것들 — sim은 bare CUDA 베이스 +
    #   mavros 모듈 없음이라 여기서 직접. (ws 트리가 vendored mavros를 포함해 catkin이
    #   빌드는 함 — 런타임엔 미사용이지만 전체 트리 빌드 보존이 동작보존에 안전)
    - ros-noetic-angles          # mavros cmake find_package(angles)
    - libgeographic-dev          # mavros FindGeographicLib
    - geographiclib-tools
    - libyaml-cpp-dev            # yaml_cpp_catkin util 링크(-lyaml-cpp)
    - ros-noetic-diagnostic-updater   # mavros
    - ros-noetic-laser-geometry       # (jetson 이미지 대조로 식별한 빌드 dep들)
    - ros-noetic-map-msgs
    - ros-noetic-resource-retriever
    - ros-noetic-urdf
    - ros-noetic-xacro
    - ros-noetic-rviz                 # voxblox_rviz_plugin 빌드 (jetson 이미지와 동일)
    - ros-noetic-depth-image-proc     # point_cloud_xyzrgb nodelet — 없으면 '무음' 로드실패로
                                      # /voxel_grid/output 데이터 0 (2026-07-25 sensor-pub 컨테이너화 실증)
    - unzip                           # install.sh libtorch 압축해제
  # JAX MPPI node python deps (jax_main_node_ros_new.py + time_profiler + viz/IO).
  # airsim (so3_control_bridge.py:25,202 RPC client)은 여기 pip 리스트가 아니라
  # install.sh에서 설치 — airsim의 setup.py가 메타데이터 생성 시점에 자기 패키지를
  # import해서 msgpackrpc가 '먼저 설치돼' 있어야 함(같은 pip 호출로는 불가, 2단계 필수).
  pip:
    - matplotlib
    - pyquaternion
    - open3d
    - tqdm
    - trimesh
  source: [install.sh]

# source + workspace live under the repo at ws/risk-aware (-> /work/ws/risk-aware) —
# the SAME physical tree planner/risk-aware and training/ete-net use, bind-mounted
# from RISK_AWARE_PLANNING_SRC (not cloned by this module: no clone.sh here).
workspace: /work/ws/risk-aware
mounts:
  - "${RISK_AWARE_PLANNING_SRC}:/work/ws/risk-aware/src/risk_aware_planning"
  # 호스트 소스빌드 python 스택(torch 2.2.0a0 ABI=1 + spconv 2.3.6 + cumm + jax/jaxlib
  # 0.4.13+cuda11 + nvidia cu11 런타임 + *_cu118.libs — 전부 cu11로 통일된 호스트 패리티.
  # jaxlib까지 호스트 것인 이유: 컨테이너 cuda12 jaxlib은 cudnn 8.9 요구인데 torch가
  # cu11 cudnn 8.7을 프리로드해 한 프로세스 공존 불가(2026-07-25 검증② 3라운드 실증).
  # ws/sim-host-python에 rsync 스테이징): jax 노드는 한 프로세스에서 python torch와
  # cxx11 libvoxblox(_voxblox_ros_python)를 같이 로드하므로 SONAME 충돌 없이 되려면
  # 둘 다 '같은' torch여야 한다 (pip ABI=0 torch론 불가 — 2026-07-25 검증② 실증).
  # sim.env가 PYTHONPATH prepend, build_ws.sh shim이 C++ 링크도 이 torch로 통일.
  - "${SIM_HOST_PY}:/opt/host-py"
  - "${SIM_RISK_AWARE_ASSETS}:${SIM_RISK_AWARE_ASSETS}"   # model weights (external, large) — host-identical absolute path (checkpoint config resolves it verbatim)

run: [run_voxblox.sh, run_exploration.sh, run_jax.sh, run_eval.sh, run_so3.sh, run_sensor_pub.sh, run_init_sim.sh]
provides: [voxblox-map, exploration, jax-mppi, so3-control, sensor-pub, init-sim]
