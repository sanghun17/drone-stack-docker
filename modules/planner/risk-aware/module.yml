name: risk-aware
group: planner
description: Risk-aware exploration planner — voxblox (uncertainty TSDF) + mav_active_3d_planning exploration + JAX MPPI local planner. Built in-container from ${PLANNER_SRC}.

needs: [compute/torch, compute/spconv, compute/jax]   # torch/spconv (model) + jax (MPPI)

deps:
  # build deps for the ETH-ASL workspace: catkin_grpc builds grpc from source
  # (rsync/libtool/autotools/ssl/zlib), protobuf_catkin builds protobuf from source.
  apt:
    - rsync
    - libtool
    - autoconf
    - automake
    - pkg-config
    - zlib1g-dev
    - libssl-dev
    - libtbb-dev
    - ros-noetic-tf-conversions
    - ros-noetic-tf2-geometry-msgs
    - ros-noetic-interactive-markers
    - ros-noetic-geographic-msgs
    - ros-noetic-nlopt
    - python3-future
    - libdw-dev
    - ros-noetic-control-toolbox
  # JAX MPPI node python deps (jax_main_node_ros_new.py + time_profiler + viz/IO)
  pip:
    - matplotlib
    - pyquaternion
    - open3d
    - tqdm
    - trimesh
    - pyvista

# source + workspace live under the repo at ws/risk-aware (-> /work/ws/risk-aware),
# cloned by `setup.sh clone`. Only the external model weights are mounted.
workspace: /work/ws/risk-aware
mounts:
  - "${RISK_AWARE_ASSETS}:/root/risk_aware_assets"  # model weights (external, large)

clone: clone.sh
run: [run_voxblox.sh, run_planner.sh, run_jax.sh]
provides: [voxblox-map, exploration, jax-mppi]
