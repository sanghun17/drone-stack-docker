name: risk-aware
group: planner
description: Risk-aware exploration capability — uncertainty-aware voxblox mapping, global exploration, and JAX MPPI local planning. Hardware and AirSim launch profiles share one source workspace.

needs: [libraries/torch, libraries/spconv, libraries/jax]   # torch/spconv (model) + jax (MPPI)

deps:
  # build deps for the ETH-ASL workspace: catkin_grpc builds grpc from source
  # (rsync/libtool/autotools/ssl/zlib), protobuf_catkin builds protobuf from source.
  apt:
    - rsync
    - libtool
    - autoconf
    - automake
    - pkg-config
    - zlib1g-dev
    - libssl-dev
    - libtbb-dev
    - ros-noetic-tf-conversions
    - ros-noetic-tf2-geometry-msgs
    - ros-noetic-interactive-markers
    - ros-noetic-geographic-msgs
    - ros-noetic-nlopt
    - python3-future
    - libdw-dev
    - ros-noetic-control-toolbox
  amd64:
    apt:
      - ros-noetic-angles
      - libgeographic-dev
      - geographiclib-tools
      - libyaml-cpp-dev
      - ros-noetic-diagnostic-updater
      - ros-noetic-laser-geometry
      - ros-noetic-map-msgs
      - ros-noetic-resource-retriever
      - ros-noetic-urdf
      - ros-noetic-xacro
      - ros-noetic-rviz
      - ros-noetic-depth-image-proc
  # JAX MPPI node python deps (jax_main_node_ros_new.py + time_profiler + viz/IO)
  pip:
    - matplotlib
    - pyquaternion
    - open3d
    - tqdm
    - trimesh
    - evo            # FAST-LIVO2 open-loop trajectory eval vs OptiTrack GT (tools/fastlivo)
    # pyvista DROPPED 2026-06-10: only the offline figure script
    # (scripts/plot_trajectory_on_mesh.py) imports it, and
    # pip's aarch64 pairing is broken (pyvista 0.44 + vtk 9.5 wheel lacks vtkCapsuleSource).
    # Re-add WITH version pins if that script ever needs to run on the Jetson.

# source + workspace live under the repo at ws/risk-aware (-> /work/ws/risk-aware),
# cloned by `setup.sh clone`. Stack manifests own host-specific asset mounts.
workspace: /work/ws/risk-aware

clone: clone.sh
run:
  - run_voxblox.sh
  - run_planner.sh
  - run_jax.sh
provides: [voxblox-map, exploration, jax-mppi]
