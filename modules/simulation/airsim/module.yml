name: airsim
group: simulation
description: >
  Reusable AirSim RPC client and configurable ROS camera bridge. Maps, Unreal
  projects, vehicle placement, and experiment tooling are owned by each stack.

deps:
  apt:
    - libyaml-cpp-dev
    - python3-numpy
    - python3-yaml
    - ros-noetic-cv-bridge
    - ros-noetic-geometry-msgs
    - ros-noetic-nav-msgs
    - ros-noetic-roscpp
    - ros-noetic-sensor-msgs
    - ros-noetic-tf
    - ros-noetic-tf2
    - ros-noetic-tf2-ros
  source: [install.sh]

run: [run_camera.sh]
provides: [airsim-client, simulated-camera, camera-info, camera-tf]
