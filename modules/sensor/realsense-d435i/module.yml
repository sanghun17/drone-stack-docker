name: realsense-d435i
group: sensor
description: Intel RealSense D435i driver (depth + color + IMU). All 4 streams; enable_sync:=false.

deps:
  apt:
    - ros-noetic-realsense2-camera
    - ros-noetic-realsense2-description
  source:
    # arm64 apt has no realsense-viewer -> source-build librealsense 2.50.0 + CUDA + the
    # graphical viewer, system-wide. Viewer uses the CUDA lib; the ROS node keeps the apt lib
    # (ROS LD_LIBRARY_PATH precedence) unless explicitly pointed at /usr/local.
    - install.sh

mounts:
  - "/dev:/dev"

run: [run.sh]
provides: [camera, depth-cloud, color, imu]
