name: see3cam-24cug
group: sensor
description: e-con Systems See3CAM_24CUG AR0234 global-shutter UVC camera.

deps:
  apt:
    - ros-noetic-usb-cam
    - ros-noetic-camera-calibration
    - ros-noetic-compressed-image-transport
    - v4l-utils
    - cmake
    - g++
    - pkg-config
    - libopencv-dev
    - libavcodec-dev
    - libswscale-dev
    - libavutil-dev
    - ros-noetic-camera-info-manager

mounts:
  - "/dev:/dev"

run: [run.sh]
provides: [camera, color, global-shutter]
