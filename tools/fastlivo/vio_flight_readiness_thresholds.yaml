schema: fastlivo_vio_flight_readiness_thresholds/v1

# All pass/fail trajectory association is at the original sensor header time.
# No per-session time shift is applied.  The auto-correlated offset in the JSON
# report is diagnostic only.
association:
  max_difference_s: 0.020

# Reject physically impossible OptiTrack intervals before interpolation.  The
# August campaign contains isolated ~180-degree/10-ms mocap flips; treating
# those as estimator errors corrupts both orientation scores and the old
# three-second GT anchor.
gt_filter:
  max_speed_mps: 5.0
  max_angular_speed_deg_s: 720.0

# This is the only spatial fit: yaw and translation over the estimator's first
# second, with unit scale.  It is frozen for the rest of the flight.
initial_alignment:
  duration_s: 1.0
  minimum_samples: 8

stationary:
  window_s: 30.0

# OptiTrack's z=0 plane is the testbed floor.  Cropped hover/mission replays
# begin near z=1 m; without this campaign-specific bound a later climb could be
# mislabeled as takeoff.  Full bags should additionally retain MAVROS landed
# state for an independent event cross-check.
takeoff:
  maximum_ground_z_m: 0.35

# Frozen conservative gates from VIO_FLIGHT_READINESS_PREREGISTRATION_20260814.
# A missing required metric yields INCOMPLETE, never PASS.  Additional PX4
# integration checks (GT isolation, covariance, and angular twist) are included
# because the estimator output cannot safely enter the current mux without them.
checks:
  - id: local_finite
    metric: local.integrity.finite
    operator: eq
    threshold: true
    required: true
  - id: local_monotonic_header
    metric: local.integrity.backward_stamp_count
    operator: eq
    threshold: 0
    required: true
  - id: local_unique_header
    metric: local.integrity.duplicate_stamp_count
    operator: eq
    threshold: 0
    required: true
  - id: local_stable_frame
    metric: local.integrity.frame_stable
    operator: eq
    threshold: true
    required: true
  - id: local_expected_frame
    metric: local.integrity.frame_is_odom
    operator: eq
    threshold: true
    required: true
  - id: local_quaternion_normalized
    metric: local.integrity.quaternion_norm_error_max
    operator: le
    threshold: 0.001
    required: true
  - id: local_nonnegative_sensor_age
    metric: local.integrity.age_min_s
    operator: ge
    threshold: 0.0
    required: true
  - id: local_max_gap
    metric: local.integrity.max_gap_s
    operator: le
    threshold: 0.25
    required: true
  - id: local_pose_coverage
    metric: local.post_initialization_coverage
    operator: ge
    threshold: 0.99
    required: true
  - id: local_fixed_association_fraction
    metric: local.fixed_timestamp_association_fraction
    operator: ge
    threshold: 0.98
    required: true
  - id: translation_ape_rmse
    metric: local.translation_ape_rmse_m
    operator: le
    threshold: 0.25
    required: true
  - id: translation_ape_max
    metric: local.translation_ape_max_m
    operator: le
    threshold: 0.50
    required: true
  - id: translation_rpe_1s
